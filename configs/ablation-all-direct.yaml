model: "qwen_all_direct"
llm_path: "Qwen/Qwen3.5-27B"
prompt_templates_file: "prompt_templates/question_prompts.csv"

# NO-COT BASELINE: empty list means every relation takes the plain
# direct-answer path (question -> answer), with no rationalized exemplars
# and no reasoning trace. This is the reference point for measuring what
# the whole CoT scaffolding is actually buying.
cot_relations: []   # no CoT: plain few-shot, question -> answer

numeric_relations:
  - "hasArea"
  - "hasCapacity"

never_abstain_relations:
  - "hasArea"
  - "hasCapacity"

# Default answer budgets.
max_new_tokens: 300
direct_max_new_tokens: 64   # one city / number / exchange fits easily
# Without CoT every relation uses direct_max_new_tokens. 64 is fine for a
# single city/number/exchange, but awardWonBy must list many names, so it
# gets its own budget or it would be truncated at ~10 names.
max_new_tokens_per_relation:
  awardWonBy: 1200
rationale_max_new_tokens: 150


# Write every raw generation here so truncation can be diagnosed directly
# instead of inferred. Comment out to disable.
raw_generations_path: "output/raw_generations.jsonl"

batch_size: 4
use_quantization: false
enable_thinking: false
few_shot: 5
# Per-relation exemplar counts (overrides few_shot above). Pool sizes in
# train.jsonl: awardWonBy 10, countryLandBordersCountry 67, the rest 100 —
# so k above the pool size just uses the whole pool.
# few_shot_per_relation:
#   personHasCityOfDeath: 10
#   hasCapacity: 10
seed: 42
train_data_file: "data/train.jsonl"
