model: "core"
llm_path: "Qwen/Qwen3.5-27B"
prompt_templates_file: "prompt_templates/question_prompts.csv"

# Per-relation routing, chosen from a head-to-head of the same model with and
# without rationalized CoT (Qwen3.5-27B, val split):
#
#   relation                      CoT     no-CoT   winner
#   hasArea                       0.610   0.480    CoT   (+13pp)
#   awardWonBy                    0.123   0.078    CoT   (+4.5pp)
#   hasCapacity                   0.180   0.160    CoT   (+2pp)
#   countryLandBordersCountry     0.939   0.978    direct (+3.9pp)
#   personHasCityOfDeath          0.380   0.500    direct (+12pp)
#   companyTradesAtStockExchange  0.624   0.624    tie -> direct (cheaper)
#
# CoT helps where the model must recall and convert a figure; it hurts where
# the task is a calibration judgement, because the reasoning talks the model
# into answering when it should stay silent.
cot_relations:
  - "hasArea"
  - "hasCapacity"
  - "awardWonBy"
  # The rewritten companyTrades template asks for a two-step decision
  # (is it listed at all -> if unsure, infer the home-country exchange).
  # On the direct path that instruction cannot execute: 64 tokens and a
  # system prompt saying "give no explanation" mean the model emits its
  # first-token guess, which is "None" on 57/100 rows. Median raw output
  # there is 4 characters. Giving the relation reasoning space is what the
  # template was written for.
  - "companyTradesAtStockExchange"

numeric_relations:
  - "hasArea"
  - "hasCapacity"

never_abstain_relations:
  - "hasArea"
  - "hasCapacity"

# Budget for the CoT relations. With greedy decoding a larger budget can only
# change rows that were previously truncated: any row that already emitted a
# "Final Answer:" line produces byte-identical tokens, since argmax at each
# step depends on the prefix, not on the length limit. Kept global rather than
# per-relation so all four CoT relations stay in one batch group and input
# padding is unchanged.
#
# Measured truncation on hasCapacity: 14% at 300 tokens, 10% at 500. The curve
# is already flat — the remaining cases are reasoning that circles without
# concluding, not reasoning that runs out of room. Expect little from 2000,
# and watch awardWonBy: on Gemma a large budget lengthened its lists and cut
# macro-f1 from 0.150 to 0.128 as per-row precision fell.
max_new_tokens: 2000          # CoT relations: reasoning + "Final Answer:" line
direct_max_new_tokens: 64    # direct relations: a single city / exchange
rationale_max_new_tokens: 150

raw_generations_path: "output/raw_generations.jsonl"

batch_size: 4
use_quantization: false
enable_thinking: false
few_shot: 5
seed: 42
train_data_file: "data/train.jsonl"
